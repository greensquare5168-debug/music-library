<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>搜尋｜圖書館音樂研究所</title>
<link rel="stylesheet" href="../style.css?v=20261029a">
<style>
.srch{display:flex;gap:8px;margin:14px 0 22px}
.srch input{flex:1;font:inherit;font-size:15px;padding:8px 12px;border:1px solid #cfd8e3;border-radius:8px}
.srch button{font:inherit;font-size:15px;padding:8px 16px;border-radius:8px;border:1px solid #2f6feb;background:#2f6feb;color:#fff;cursor:pointer}
#res{list-style:none;padding:0;margin:0}
#res li{padding:8px 0;border-bottom:1px solid #eef2f7}
#res a{color:#1a56c4;text-decoration:none}
#res a:hover{text-decoration:underline}
.muted2{color:#6b7280;font-size:13px}
.grp{margin:18px 0 6px;font-size:13px;font-weight:700;color:#334155;border-bottom:1px solid #dbe3ec;padding-bottom:4px}
</style>
</head><body>
<header class="site-head"><div class="wrap head-row">
  <div><a class="brand" href="../index.html">圖書館音樂研究所</a></div>
  <nav class="topnav">
    <a class="navbtn" href="../罐頭音樂研究所/圖書館音樂/index.html">音樂圖書館</a>
    <a class="navbtn" href="../使用公司/index.html">使用公司</a>
  <span class="navsearch"><input class="navq" type="search" data-go="../搜尋/index.html" placeholder="搜尋…" style="font:inherit;font-size:13px;padding:5px 9px;border:1px solid #cfd8e3;border-radius:8px;width:150px"><button class="navgo" type="button" style="font:inherit;font-size:13px;padding:5px 10px;border-radius:8px;border:1px solid #2f6feb;background:#2f6feb;color:#fff;cursor:pointer">搜尋</button></span></nav>
</div></header>
<main class="wrap">
  <h1>搜尋</h1>
  <div class="srch"><input id="q2" type="search" placeholder="輸入關鍵字，例如：Ducky、巧連智、RSM125"></div>
  <p class="muted2" id="stat"></p>
  <ul id="res"></ul>
</main>
<script>
(function(){
  var idx=null;
  function load(){ if(idx) return Promise.resolve(idx); return fetch('../search-index.json?v=20261030b').then(r=>r.json()).then(d=>{idx=d;return d;}); }
  function norm(s){ return (s||'').toLowerCase(); }
  function item(it){
    var li=document.createElement('li');
    var a=document.createElement('a'); a.href='../'+it.p; a.textContent=it.t;
    li.appendChild(a); return li;
  }
  function head(txt){
    var d=document.createElement('div'); d.className='grp'; d.textContent=txt; return d;
  }
  function render(q){
    load().then(function(list){
      var res=document.getElementById('res'), stat=document.getElementById('stat');
      res.innerHTML=''; var k=norm(q).trim();
      if(!k){ stat.textContent=''; return; }
      var tHit=[], kHit=[];
      list.forEach(function(it){
        if(norm(it.t).indexOf(k)>=0 || norm(decodeURIComponent(it.p)).indexOf(k)>=0){ tHit.push(it); }
        else if(norm(it.k||'').indexOf(k)>=0){ kHit.push(it); }
      });
      tHit.sort(function(a,b){ return a.t.length-b.t.length; });
      stat.textContent='找到 '+(tHit.length+kHit.length)+' 筆';
      if(tHit.length){ res.appendChild(head('名稱符合（'+tHit.length+'）')); tHit.slice(0,150).forEach(function(it){ res.appendChild(item(it)); }); }
      if(kHit.length){ res.appendChild(head('節目／相關頁面（曲目出現在該頁：'+kHit.length+'）')); kHit.slice(0,150).forEach(function(it){ res.appendChild(item(it)); }); }
    });
  }
  document.getElementById('q2').addEventListener('input',function(){ render(this.value); });
  var q=new URLSearchParams(location.search).get('q')||'';
  if(q){ document.getElementById('q2').value=q; render(q); }
})();
</script>
</body></html>
