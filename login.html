<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>會員登入｜圖書館音樂研究所</title>
<link rel="stylesheet" href="style.css">
<style>
/* 登入介面（本頁專用，不動主站 style.css） */
.demo-bar{background:#fff7e6;border-bottom:1px solid #f3d9a4;color:#8a5a00;font-size:13px;padding:8px 0}
.demo-bar .wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.demo-bar b{color:#8a5a00}
.auth-wrap{max-width:448px;margin:34px auto 60px}
.auth-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px 26px 22px;box-shadow:0 10px 30px rgba(20,40,70,.06)}
.tabs{display:flex;gap:6px;background:#f1f5f9;border-radius:11px;padding:4px;margin-bottom:20px}
.tabs button{flex:1;border:0;background:transparent;border-radius:8px;padding:9px 0;font:inherit;font-size:14px;color:#5c6675;cursor:pointer}
.tabs button.on{background:#fff;color:#1f2733;font-weight:700;box-shadow:0 1px 4px rgba(20,40,70,.1)}
.auth-card h1{font-size:21px;margin:0 0 4px;text-align:center}
.auth-card .sub{text-align:center;margin-bottom:20px}
.scope{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:-8px 0 20px}
.scope span{font-size:12px;color:#5c6675;background:#f1f5f9;border:1px solid #e3e8ee;border-radius:999px;padding:2px 9px}
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field label .opt{font-weight:400;color:#9aa6b6}
.inp{position:relative;display:flex;align-items:center}
.inp input{width:100%;background:#fff;border:1px solid #cfd8e3;border-radius:10px;padding:12px 44px 12px 14px;font:inherit;font-size:15px;color:var(--fg);outline:none;transition:border-color .15s,box-shadow .15s}
.inp input::placeholder{color:#a7b1c0}
.inp input:focus{border-color:#2f6feb;box-shadow:0 0 0 3px rgba(47,111,235,.12)}
.inp .eye{position:absolute;right:6px;border:0;background:transparent;cursor:pointer;font-size:16px;line-height:1;padding:8px 10px;color:#8a97a8;border-radius:8px}
.inp .eye:hover{background:#f1f5f9;color:#334}
.row-between{display:flex;justify-content:space-between;align-items:center;margin:2px 0 16px;font-size:13.5px}
.chk{display:flex;align-items:center;gap:7px;color:var(--muted);cursor:pointer;user-select:none}
.chk input{width:15px;height:15px;accent-color:#2f6feb;cursor:pointer}
.btn-main{width:100%;border:0;border-radius:10px;background:#2f6feb;color:#fff;font:inherit;font-size:16px;font-weight:700;padding:13px 16px;cursor:pointer;transition:background .15s,transform .05s;display:inline-block;text-align:center;text-decoration:none}
.btn-main:hover{background:#255cc7;text-decoration:none;color:#fff}
.btn-main:active{transform:translateY(1px)}
.btn-main:disabled{background:#9db4dd;cursor:not-allowed}
.msg{display:none;margin:13px 0 0;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.5}
.msg.err{display:block;background:#fff1f0;border:1px solid #f6c2bd;color:#a4262c}
.msg.ok{display:block;background:#f0faf3;border:1px solid #cfe9d8;color:#15803d}
.or{display:flex;align-items:center;gap:10px;color:#9aa6b6;font-size:12.5px;margin:18px 0 13px}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.btn-ghost{display:flex;width:100%;align-items:center;justify-content:center;gap:9px;border:1px solid #cfd8e3;background:#fff;border-radius:10px;padding:11px 14px;font:inherit;font-size:14.5px;color:#334;cursor:pointer;text-decoration:none}
.btn-ghost:hover{background:#f6f8fb;text-decoration:none}
.gicon{width:18px;height:18px;display:inline-block}
.foot-links{text-align:center;margin-top:18px;font-size:13.5px;color:var(--muted)}
.foot-links a{color:#2f6feb;font-weight:600}
.hint{margin-top:15px;background:#f6f8fb;border:1px dashed #cfd8e3;border-radius:10px;padding:10px 12px;font-size:12.5px;color:#5c6675;line-height:1.6}
.hint code{background:#fff;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12px}
.signed{display:none;text-align:center}
.signed .who{font-weight:700;font-size:15px;margin:6px 0 2px}
.agree{font-size:12.5px;color:var(--muted);display:flex;gap:7px;align-items:flex-start;margin:2px 0 14px;line-height:1.5}
.agree input{margin-top:2px;accent-color:#2f6feb}
@media(max-width:640px){.topnav{flex-wrap:wrap}}
@media(max-width:520px){.auth-wrap{margin:20px auto 40px}.auth-card{padding:22px 18px}}
</style></head>
<body>


<header class="site-head"><div class="wrap head-row">
  <div><a class="brand" href="index.html">圖書館音樂研究所</a>
    <div class="sub">全站會員登入</div>
  </div>
  <nav class="topnav">
    <a class="navbtn" href="罐頭音樂研究所/圖書館音樂/index.html">音樂圖書館</a>
    <a class="navbtn" href="https://greensquare5168-debug.github.io/multi-language/">語言學習區</a>
    <a class="navbtn" href="知識補給站/index.html">知識補給站</a>
    <a class="navbtn" href="使用公司/index.html">使用公司</a>
    <a class="navbtn on" href="login.html">登入</a>
  </nav>
</div></header>

<main class="wrap">
  <div class="auth-wrap">
    <div class="auth-card">
      <div id="formView">
        <div class="tabs" id="tabsWrap">
          <button id="tabLogin" class="on" type="button">登入</button>
          <button id="tabReg" type="button">註冊</button>
        </div>
        <h1 id="cardTitle">會員登入</h1>
        <div class="sub" id="cardSub">一個帳號，通行全站</div>
        <div class="scope"><span>音樂圖書館</span><span>語言學習區</span><span>知識補給站</span><span>使用公司</span></div>

        <form id="authForm" novalidate>
          <div class="field" id="nameField" style="display:none">
            <label for="name">暱稱</label>
            <div class="inp"><input id="name" name="name" type="text" maxlength="16" autocomplete="nickname" placeholder="要怎麼稱呼你？"></div>
          </div>

          <div class="field">
            <label for="email">電子郵件</label>
            <div class="inp"><input id="email" name="email" type="email" autocomplete="username" placeholder="you@example.com" required></div>
          </div>

          <div class="field">
            <label for="pwd">密碼</label>
            <div class="inp">
              <input id="pwd" name="pwd" type="password" autocomplete="current-password" placeholder="請輸入密碼" required>
              <button class="eye" type="button" id="eye" aria-label="顯示密碼">👁</button>
            </div>
          </div>

          <div class="field" id="pwd2Field" style="display:none">
            <label for="pwd2">確認密碼</label>
            <div class="inp"><input id="pwd2" name="pwd2" type="password" autocomplete="new-password" placeholder="再輸入一次"></div>
          </div>

          <div class="row-between">
            <label class="chk" id="rememberWrap"><input type="checkbox" id="remember" checked> 記住我</label>
            <a href="#" id="forgot">忘記密碼？</a>
          </div>

          <button class="btn-main" type="submit" id="submitBtn">登入</button>
          <div class="msg" id="msg" role="alert"></div>
        </form>

        <div class="or">或</div>
        <button class="btn-ghost" type="button" id="googleBtn">
          <svg class="gicon" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.2 17.7 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-2.8-.4-4.1H24v8.4h12.5c-.3 2.1-1.6 5.2-4.6 7.3l7.6 5.9c4.5-4.1 6.6-10.1 6.6-17.5z"/>
            <path fill="#FBBC05" d="M10.4 28.7a14.5 14.5 0 0 1 0-9.4l-7.8-6.1a24 24 0 0 0 0 21.6l7.8-6.1z"/>
            <path fill="#34A853" d="M24 48c6.3 0 11.6-2.1 15.5-5.8l-7.6-5.9c-2.1 1.4-4.8 2.3-7.9 2.3-6.3 0-11.7-3.7-13.6-9.9l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/>
          </svg>
          Google 帳號登入
        </button>
        <div class="foot-links"><a href="#" id="guestLink">先以訪客身分逛逛</a></div>

        <div class="hint" id="hintBox">
          登入狀態由雲端驗證（Supabase），換手機、換電腦都登得進去。<br>
          忘記密碼會寄一封重設信到你的信箱。
        </div>
      </div>

      <div id="signedView" class="signed">
        <div style="font-size:34px">✅</div>
        <div class="who" id="signedWho">已登入</div>
        <div class="sub" id="signedWhen"></div>
        <p style="margin-top:18px"><a class="btn-main" href="member.html">前往會員中心</a></p>
        <div class="foot-links"><a href="#" id="logout2">登出</a></div>
      </div>
    </div>
  </div>
</main>

<script src="supabase-config.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SB_URL = (window.SUPABASE_URL || '').trim();
const SB_KEY = (window.SUPABASE_ANON_KEY || '').trim();
const OK = /^https:\/\/.+\.supabase\.co$/.test(SB_URL) && SB_KEY.length > 20;

const sb = OK ? createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }) : null;

const $ = id => document.getElementById(id);
const form = $('authForm'), msg = $('msg'), btn = $('submitBtn');
const qs = new URLSearchParams(location.search);
const NEXT = qs.get('next') || 'member.html';
let mode = 'login';

/* ---------- 訊息 ---------- */
function showMsg(t, kind){ msg.className = 'msg ' + (kind || 'err'); msg.textContent = t; }
function clearMsg(){ msg.className = 'msg'; msg.textContent = ''; }

/* ---------- 錯誤翻譯 ---------- */
function tr(err){
  const m = (err && (err.message || err.error_description || '')) + '';
  if (/Invalid login credentials/i.test(m)) return '電子郵件或密碼不正確';
  if (/Email not confirmed/i.test(m)) return '這個 Email 還沒驗證 —— 請去信箱點確認連結（或請管理者關閉 Confirm email）';
  if (/User already registered/i.test(m)) return '這個 Email 已經註冊過了，直接登入即可';
  if (/Password should be at least/i.test(m)) return '密碼太短（至少 6 碼）';
  if (/rate limit|Too many requests/i.test(m)) return '嘗試次數太多，請等一分鐘再試';
  if (/Invalid email/i.test(m)) return '電子郵件格式不正確';
  if (/Failed to fetch|NetworkError/i.test(m)) return '連不上伺服器，請檢查網路後再試';
  return m || '發生未知錯誤';
}

/* ---------- 畫面切換 ---------- */
function setMode(m){
  mode = m;
  const login = m === 'login';
  $('tabLogin').classList.toggle('on', login);
  $('tabReg').classList.toggle('on', !login);
  $('nameField').style.display = login ? 'none' : 'block';
  $('pwd2Field').style.display = login ? 'none' : 'block';
  $('cardTitle').textContent = login ? '會員登入' : '註冊會員';
  $('cardSub').textContent = login ? '一個帳號，通行全站' : '填好就能開始，資料存在雲端';
  btn.textContent = login ? '登入' : '建立帳號';
  $('pwd').setAttribute('autocomplete', login ? 'current-password' : 'new-password');
  $('pwd').placeholder = login ? '請輸入密碼' : '設定密碼（至少 6 碼）';
  $('rememberWrap').style.visibility = login ? 'visible' : 'hidden';
  $('forgot').style.visibility = login ? 'visible' : 'hidden';
  clearMsg();
}
$('tabLogin').addEventListener('click', () => setMode('login'));
$('tabReg').addEventListener('click', () => setMode('reg'));

$('eye').addEventListener('click', function(){
  const p = $('pwd'), p2 = $('pwd2');
  const on = p.type === 'password';
  p.type = on ? 'text' : 'password'; if (p2) p2.type = p.type;
  this.textContent = on ? '🙈' : '👁';
  this.setAttribute('aria-label', on ? '隱藏密碼' : '顯示密碼');
});

function fmtTs(ts){
  const d = new Date(ts);
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '/' + p(d.getMonth()+1) + '/' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function renderSigned(session){
  $('formView').style.display = 'none';
  $('signedView').style.display = 'block';
  const u = session.user || {};
  const name = (u.user_metadata && u.user_metadata.name) || u.email || '已登入';
  $('signedWho').textContent = name;
  $('signedWhen').textContent = '登入時間 ' + fmtTs(Date.now()) + '　·　帳號 ' + (u.email || '');
  $('logout2').onclick = async (e) => {
    e.preventDefault();
    if (sb) await sb.auth.signOut();
    location.href = 'login.html';
  };
}
function go(){ location.href = NEXT; }

/* ---------- 表單送出 ---------- */
form.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  if (!OK){ showMsg('後端還沒設定，請先填 supabase-config.js（或請管理者設定）'); return; }
  const email = ($('email').value || '').trim().toLowerCase();
  const pwd = $('pwd').value || '';
  const name = ($('name').value || '').trim();
  const pwd2 = $('pwd2').value || '';

  if (!email) return showMsg('請輸入電子郵件');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showMsg('電子郵件格式不正確');
  if (!pwd) return showMsg('請輸入密碼');
  if (mode === 'reg' && pwd.length < 6) return showMsg('密碼至少 6 碼');
  if (mode === 'reg' && pwd !== pwd2) return showMsg('兩次輸入的密碼不一樣');

  btn.disabled = true;
  btn.textContent = mode === 'login' ? '登入中…' : '建立中…';
  clearMsg();

  try{
    if (mode === 'login'){
      const { error } = await sb.auth.signInWithPassword({ email, password: pwd });
      if (error) throw error;
      showMsg('登入成功，正在進入…', 'ok');
      setTimeout(go, 500);
    } else {
      const { data, error } = await sb.auth.signUp({ email, password: pwd, options: { data: { name: name || email.split('@')[0] } } });
      if (error) throw error;
      if (data.session){ showMsg('帳號建立完成，正在進入…', 'ok'); setTimeout(go, 500); }
      else { showMsg('已寄出驗證信 —— 請到信箱點確認連結後再登入', 'ok'); btn.disabled = false; btn.textContent = '建立帳號'; }
    }
  }catch(err){
    showMsg(tr(err));
    btn.disabled = false; btn.textContent = mode === 'login' ? '登入' : '建立帳號';
  }
});

/* 忘記密碼（寄重設信） */
$('forgot').addEventListener('click', async (e) => {
  e.preventDefault();
  if (!OK) return showMsg('後端還沒設定');
  const email = ($('email').value || '').trim().toLowerCase();
  if (!email) return showMsg('先在上面填你的電子郵件，再按忘記密碼');
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  if (error) return showMsg(tr(error));
  showMsg('重設信已寄出，請到信箱點連結（10 分鐘內有效）', 'ok');
});

/* 重設密碼（從信件點回來的畫面） */
async function maybeRecovery(){
  if (!OK) return;
  if (!/[?#&]type=recovery/.test(location.hash + location.search)) return;
  $('formView').style.display = 'block';
  $('signedView').style.display = 'none';
  $('tabsWrap').style.display = 'none';
  $('cardTitle').textContent = '設定新密碼';
  $('cardSub').textContent = '請輸入新密碼（至少 6 碼）';
  $('nameField').style.display = 'none';
  $('pwd2Field').style.display = 'block';
  $('email').closest('.field').style.display = 'none';
  $('pwd').placeholder = '新密碼';
  $('rememberWrap').style.display = 'none';
  $('forgot').style.display = 'none';
  form.dataset.recovery = '1';
  btn.textContent = '更新密碼';
  form.onsubmit = null;
  btn.onclick = async (ev) => {
    ev.preventDefault();
    const pwd = $('pwd').value, pwd2 = $('pwd2').value;
    if (pwd.length < 6) return showMsg('密碼至少 6 碼');
    if (pwd !== pwd2) return showMsg('兩次輸入的密碼不一樣');
    const { error } = await sb.auth.updateUser({ password: pwd });
    if (error) return showMsg(tr(error));
    showMsg('密碼已更新，正在進入…', 'ok');
    setTimeout(go, 600);
  };
}

/* ---------- 啟動 ---------- */
(async function boot(){
  if (!OK){
    btn.disabled = true;
    showMsg('目前無法登入 —— 尚未連上後端資料庫');
    return;
  }
  try{
    const { data } = await sb.auth.getSession();
    if (data && data.session) { renderSigned(data.session); }
    else { setMode('login'); }
    sb.auth.onAuthStateChange((evt, session) => { if (evt === 'SIGNED_IN' && session) renderSigned(session); });
    await maybeRecovery();
  }catch(e){
    showMsg('連不上後端：' + tr(e));
  }
})();
</script>
</body></html>
