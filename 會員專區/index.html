<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>付費專區｜圖書館音樂研究所</title>
<link rel="stylesheet" href="../style.css">
<style>
.demo-bar{background:#fff7e6;border-bottom:1px solid #f3d9a4;color:#8a5a00;font-size:13px;padding:8px 0}
.demo-bar .wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.member-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.who-chip{display:inline-flex;align-items:center;gap:8px;background:#f0faf3;border:1px solid #cfe9d8;color:#15803d;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.btn-sm{display:inline-block;border:1px solid #cfd8e3;background:#fff;border-radius:9px;padding:7px 13px;font:inherit;font-size:13px;color:#334;cursor:pointer;text-decoration:none}
.btn-sm:hover{background:#f6f8fb;text-decoration:none}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:6px}
.plan{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:8px}
.plan h3{margin:0;font-size:16px}
.plan .desc{color:var(--muted);font-size:13.5px;flex:1}
.plan .price{font-size:20px;font-weight:700;color:#1f2733}
.plan .price small{font-size:12.5px;font-weight:400;color:var(--muted)}
.locked{opacity:.6}
.tip{background:#f6f8fb;border:1px dashed #cfd8e3;border-radius:10px;padding:11px 13px;font-size:12.5px;color:#5c6675;margin-top:16px;line-height:1.6}
@media(max-width:640px){.topnav{flex-wrap:wrap}}
</style></head>
<body>
<div class="demo-bar"><div class="wrap">
  <span>🧪 <b>示範版</b>：這一頁是「登入後才看得到」的樣板，正式版要接後端才擋得住。</span>
</div></div>

<header class="site-head"><div class="wrap head-row">
  <div><a class="brand" href="../index.html">圖書館音樂研究所</a>
    <div class="sub">付費專區</div></div>
  <nav class="topnav">
    <a class="navbtn" href="../罐頭音樂研究所/圖書館音樂/index.html">音樂圖書館</a>
    <a class="navbtn" href="../知識補給站/index.html">知識補給站</a>
    <a class="navbtn on" href="./index.html">付費專區</a>
  </nav>
</div></header>

<main class="wrap">
  <div class="album-card">
    <div class="member-head">
      <div>
        <h1 style="margin-bottom:4px">付費專區</h1>
        <div class="muted">登入後可使用完整資料與批次匯出</div>
      </div>
      <div style="display:flex;gap:10px;align-items:center">
        <span class="who-chip">👤 <span id="who">會員</span></span>
        <a class="btn-sm" href="#" id="logout">登出</a>
      </div>
    </div>
  </div>

  <div class="album-card">
    <h2 style="font-size:18px;margin:0 0 8px">會員權益</h2>
    <div class="plans">
      <div class="plan">
        <h3>完整曲目庫</h3>
        <div class="desc">全部品牌／專輯／曲目、作曲者本名、使用作品對照</div>
        <div class="price">已解鎖</div>
        <a class="btn-sm" href="../罐頭音樂研究所/圖書館音樂/index.html">前往音樂圖書館</a>
      </div>
      <div class="plan locked">
        <h3>批次匯出</h3>
        <div class="desc">勾選曲目 → 匯出 CSV／Excel（授權清冊用）</div>
        <div class="price">示範</div>
        <button class="btn-sm" type="button" disabled>尚未開放</button>
      </div>
      <div class="plan locked">
        <h3>授權與使用查詢</h3>
        <div class="desc">某節目用過哪些曲子、授權期限與費用估算</div>
        <div class="price">示範</div>
        <button class="btn-sm" type="button" disabled>尚未開放</button>
      </div>
    </div>
    <div class="tip">
      這頁只是「登入後的畫面」示意。要做成真的收費專區，需要：① 會員資料庫（帳號／到期日）② 付款（綠界／藍新／Stripe）③ 內容放在需要驗證才拿得到的位置。
    </div>
  </div>
</main>

<script>
(function(){
  var KEY='ml_session_v1';
  var s=null;
  try{ s=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){ s=null; }
  if(!s || !s.email){ location.replace('./login.html'); return; }
  document.getElementById('who').textContent=s.name||s.email;
  document.getElementById('logout').addEventListener('click',function(e){
    e.preventDefault();
    localStorage.removeItem(KEY);
    location.href='./login.html';
  });
})();
</script>
</body></html>
