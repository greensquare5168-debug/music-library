<script>
(function(){
 var bar=document.querySelector('.albumfilter'); if(!bar) return;
 var ul=document.querySelector('ul.albumlist'); if(!ul) return;
 var rows=[].slice.call(ul.querySelectorAll('li'));
 function used(r){return !r.querySelector('.mark-x');}
 var n=rows.filter(used).length, stat=bar.querySelector('.afstat');
 if(stat){stat.textContent='已使用 '+n+' / '+rows.length+' 張';}
 var tgl=bar.querySelector('.aftoggle'), cur=bar.querySelector('.afcur');
 function setOpen(o){bar.classList.toggle('open',o);if(tgl)tgl.setAttribute('aria-expanded',o?'true':'false');}
 if(tgl)tgl.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();setOpen(!bar.classList.contains('open'));});
 var empty=document.createElement('li'); empty.className='afempty'; empty.style.display='none'; empty.textContent='（目前沒有已使用的專輯）'; ul.appendChild(empty);
 var key='af:'+location.pathname;
 function apply(f){
  rows.forEach(function(r){r.style.display=(f==='used'&&!used(r))?'none':'';});
  empty.style.display=(f==='used'&&n===0)?'':'none';
  [].forEach.call(bar.querySelectorAll('.afbtn'),function(b){b.classList.toggle('active',b.getAttribute('data-f')===f);});
  if(cur)cur.textContent=(f==='used')?'已使用':'全部';
  try{localStorage.setItem(key,f);}catch(e){}
 }
 bar.addEventListener('click',function(e){
   var b=e.target.closest?e.target.closest('.afbtn'):null; if(!b)return;
   apply(b.getAttribute('data-f')); setOpen(false);
 });
 document.addEventListener('click',function(e){ if(!bar.contains(e.target)) setOpen(false); });
 var f='all'; try{f=localStorage.getItem(key)||'all';}catch(e){}
 apply(f); setOpen(false);
})();
