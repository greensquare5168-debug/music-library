<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>站主編輯器｜圖書館音樂研究所</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#f6f8fb;color:#1f2733}
header{background:#fff;border-bottom:1px solid #e3e8ee;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:17px;margin:0}
.wrap{max-width:1000px;margin:0 auto;padding:20px}
.card{background:#fff;border:1px solid #e3e8ee;border-radius:14px;padding:18px;margin-bottom:16px}
h2{font-size:15px;margin:0 0 12px;color:#334}
input[type=text],input[type=search]{font:inherit;padding:9px 12px;border:1px solid #cfd8e3;border-radius:9px;width:100%}
button{font:inherit;padding:9px 16px;border-radius:9px;border:1px solid #2f6feb;background:#2f6feb;color:#fff;cursor:pointer}
button.ghost{background:#fff;color:#334;border-color:#cfd8e3}
select{font:inherit;padding:9px 12px;border:1px solid #cfd8e3;border-radius:9px;background:#fff;width:100%;max-width:100%}
.row{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
label{font-size:13px;color:#5c6675;display:block;margin-bottom:5px}
.hit{padding:10px 12px;border:1px solid #e3e8ee;border-radius:10px;margin-bottom:8px;cursor:pointer;background:#fff}
.hit:hover{background:#eef3fb;border-color:#2f6feb}
.hit .t{font-weight:600;font-size:14px}
.hit .m{font-size:12.5px;color:#6b7280;margin-top:3px}
.usage{display:flex;gap:8px;align-items:flex-start;padding:9px;border:1px solid #e3e8ee;border-radius:10px;margin-bottom:8px;background:#fbfcfe}
.usage input[type=text]{font-size:13px}
.usage .del{background:#fff;color:#b42318;border-color:#f3c0bb;padding:7px 11px;white-space:nowrap}
.msg{margin-top:12px;font-size:13.5px;padding:10px 12px;border-radius:9px;display:none}
.msg.ok{display:block;background:#eaf7ef;color:#12894a;border:1px solid #bfe6cd}
.msg.err{display:block;background:#fdf0ef;color:#b42318;border:1px solid #f3c0bb}
.muted{color:#6b7280;font-size:12.5px}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:14px}
.chk{width:20px;height:20px}
.pill{display:inline-block;background:#eef3fb;color:#2f6feb;border-radius:999px;padding:2px 10px;font-size:12px;margin-left:8px}
</style></head>
<body>
<header>
  <h1>✏️ 站主編輯器</h1>
  <span class="muted">存檔會送到雲端待辦，主機 1–3 分鐘內套用並上線</span>
</header>
<div class="wrap">

  <div class="card" style="background:#eaf7ef;border-color:#bfe6cd">
    <b>✅ 現在可以直接在頁面上改</b> — 這裡只是備援入口。
    到任一個曲目頁，按右下角的綠色 <b>✏️</b>，文字與「使用作品」會當場變成可修改，按儲存就送出。
  </div>

  <div class="card">
    <h2>① 找曲目</h2>
    <p class="muted" style="margin:0 0 12px">也可以直接從曲目頁按右下角 ✏️ 跳進來（會自動帶到那一頁）。</p>
    <div class="row">
      <select id="brand"><option value="">— 先選品牌（或直接搜尋）—</option></select>
    </div>
    <div class="row" id="albumRow" style="display:none">
      <select id="album"><option value="">— 選專輯 —</option></select>
    </div>
    <div class="row" id="trackRow" style="display:none">
      <select id="track"><option value="">— 選曲目 —</option></select>
    </div>
    <div class="row" style="margin-top:6px">
      <input id="q" type="search" placeholder="或直接打曲名（中文／英文都可以，例：Nocturne、小紅帽）">
      <button id="go">搜尋</button>
    </div>
    <div id="hits"></div>
  </div>

  <div class="card" id="editor" style="display:none">
    <h2>② 編輯 <span class="pill" id="cur"></span></h2>

    <label>曲名</label>
    <input id="title" type="text">
    <div style="height:10px"></div>
    <label>作者</label>
    <input id="artist" type="text">
    <div style="height:12px"></div>
    <button id="saveTitle">儲存曲名／作者</button>

    <hr style="border:0;border-top:1px solid #eef2f7;margin:20px 0">

    <h2>使用作品 <span class="muted" id="nuse"></span></h2>
    <div id="usages"></div>
    <button class="ghost" id="addUsage">＋ 加一筆</button>
    <div style="height:12px"></div>
    <button id="saveUsage">儲存使用作品（自動照網站排法排序）</button>

    <hr style="border:0;border-top:1px solid #eef2f7;margin:20px 0">

    <h2>專輯頁這首的 ✓</h2>
    <label class="switch"><input type="checkbox" id="mark" class="chk"> 這首有使用作品（打勾）</label>
    <div style="height:10px"></div>
    <button id="saveMark">儲存 ✓ 狀態</button>

    <div class="msg" id="msg"></div>
  </div>

  <div class="card" id="who" style="font-size:13px"></div>

  <div class="card muted" style="font-size:12.5px;line-height:1.8">
    ⓘ <b>不用貼 GitHub token。</b>按存檔後，改動會先送到網站的雲端待辦，主機（U4）每 2 分鐘取走、
    套用、commit 並上線，約 <b>1–3 分鐘</b>官網就會更新。
  </div>
</div>

<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm" type="module"></script>
<script src="_admin/editor-relay.js"></script>
<script>
const $ = id => document.getElementById(id);
let CUR = null;

function msg(t, ok){
  const m = $('msg'); m.textContent = t; m.className = 'msg ' + (ok ? 'ok' : 'err');
  clearTimeout(msg._t); msg._t = setTimeout(()=>{ m.className='msg'; }, 12000);
}

/* ── 2026-11-27 改：不再需要主機端 /api/…；先用站內索引挑選，再直接解析該頁 HTML ── */
const LIB_URL = 'lib-index.json?v=20261127h';
let LIB = null, PAGE_DOC = null;

function loadLib(){
  if(LIB) return Promise.resolve(LIB);
  return fetch(LIB_URL).then(r => r.json()).then(d => { LIB = d; return d; });
}
function opts(sel, list, ph){
  sel.innerHTML = '<option value="">' + ph + '</option>' +
    list.map((x,i) => `<option value="${i}">${x.n}</option>`).join('');
}

async function initPickers(){
  let lib;
  try{ lib = await loadLib(); }
  catch(e){ $('brand').innerHTML = '<option value="">索引載入失敗：' + e.message + '</option>'; return; }
  opts($('brand'), lib, '— 先選品牌（或直接搜尋）—');
  $('brand').onchange = () => {
    const b = lib[+$('brand').value];
    $('hits').innerHTML = '';
    if(!b){ $('albumRow').style.display='none'; $('trackRow').style.display='none'; return; }
    opts($('album'), b.albums, '— 選專輯 —');
    $('albumRow').style.display = 'flex'; $('trackRow').style.display='none';
  };
  $('album').onchange = () => {
    const b = lib[+$('brand').value], a = b && b.albums[+$('album').value];
    if(!a){ $('trackRow').style.display='none'; return; }
    opts($('track'), a.t, '— 選曲目 —');
    $('trackRow').style.display = 'flex';
  };
  $('track').onchange = () => {
    const b = lib[+$('brand').value], a = b && b.albums[+$('album').value], t = a && a.t[+$('track').value];
    if(t) openPage('罐頭音樂研究所/圖書館音樂/' + t.h + 'index.html');
  };
}

/* 同一頁若有 ?page= 就直接開 */
function initFromQuery(){
  const rel = new URLSearchParams(location.search).get('page');
  if(rel) openPage(decodeURIComponent(rel));
}

/* 身分檢查：必須站主會員登入 */
function whoCard(){
  const box = $('who');
  const R = window.U4Edit;
  if(!R){ box.innerHTML = '<b style="color:#b42318">⚠️ 中繼腳本沒載入（_admin/editor-relay.js）</b>'; return false; }
  const em = R.email();
  if(!em){
    box.innerHTML = '<b style="color:#b42318">尚未登入</b> — <a href="login.html?next=' +
      encodeURIComponent('admin-edit.html' + location.search) + '">先用站主帳號登入</a>，回來就能直接改。';
    return false;
  }
  if(!R.isOwner()){
    box.innerHTML = '<b style="color:#b42318">這個帳號（' + em + '）沒有編輯權限</b> — 請用站主帳號登入。';
    return false;
  }
  box.innerHTML = '✅ 已用站主帳號登入：<b>' + em + '</b>　·　存檔後約 1–3 分鐘上線';
  return true;
}

/* 站上三種動作，一律走雲端待辦 */
async function submit(kind, payload){
  try{
    const d = await window.U4Edit.submit(kind, CUR.rel, payload);
    msg('✅ 已送出（# ' + (d.id||'?') + '）— 主機處理中，約 1–3 分鐘上線。重新整理頁面可看到結果。', true);
    return d;
  }catch(e){
    const m = String(e.message||e);
    if(/PGRST205|Could not find the table/i.test(m))
      msg('⚠️ 雲端待辦表還沒建立：請先到 admin.html 的「一次性設定」把 SQL 貼進 Supabase 執行。', false);
    else if(/404|Not Found/i.test(m))
      msg('⚠️ 伺服器還沒建好資料表或尚未開放（' + m + '）。', false);
    else
      msg('送出失敗：' + m, false);
    throw e;
  }
}

async function openPage(rel){
  try{
    if(!whoCard()) return;              // 沒登入就不載入（也擋掉亂用）
    $('editor').style.display='none';
    const url = rel.replace(/^\/+/, '').replace(/^music-library\//,'')
                   .replace('罐頭音樂研究所/圖書館音樂/','');
    const r = await fetch(encodeURI('罐頭音樂研究所/圖書館音樂/' + url) + '?v=' + Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error('開不了這一頁（HTTP ' + r.status + '）');
    const html = await r.text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const title = pickText(doc, ['h1','.song-title','.track-title','h2']);
    const artist = pickArtist(doc);
    const usage = pickUsage(doc);
    PAGE_DOC = {rel: rel, doc: doc, html: html};
    CUR = {rel: rel, title: title, artist: artist, usage: usage, doc: doc};
    $('editor').style.display = 'block';
    $('cur').textContent = rel.split('/').filter(Boolean).slice(-2)[0] || rel;
    $('title').value = title;
    $('artist').value = artist;
    renderUsage(usage);
    $('mark').checked = usage.length > 0;
    $('editor').scrollIntoView({behavior:'smooth'});
    try{ history.replaceState(null,'','?page='+encodeURIComponent(rel)); }catch(e){}
  }catch(e){ msg('載入失敗：' + e.message, false); }
}

/* ── 從曲目頁 HTML 讀出曲名／作者／使用作品（不再依賴主機端 API）── */
function q1(doc, sels){
  for(const s of sels){ const el = doc.querySelector(s); if(el && el.textContent.trim()) return el.textContent.trim(); }
  return '';
}
function pickText(doc, sels){ return q1(doc, sels).replace(/\s*[|｜].*$/, '').trim(); }
function pickArtist(doc){
  const el = doc.querySelector('.albumartist,.artist,.creator,.composer,[data-artist]');
  if(el && el.textContent.trim()) return el.textContent.trim().replace(/^(作者|作曲|作曲者)[:：]\s*/, '');
  const t = doc.body ? doc.body.textContent : '';
  const m = t.match(/(?:作者|作曲(?:者)?)[:：]\s*([^\n<]{1,80})/);
  return m ? m[1].trim() : '';
}
function pickUsage(doc){
  const out = [];
  const seen = new Set();
  [...doc.querySelectorAll('.album-card li a[href], .entries li a[href], #usages a[href]')].forEach(a => {
    const href = a.getAttribute('href') || '';
    const title = (a.textContent || '').trim();
    if(!title || !href || /^(#|javascript:)/.test(href)) return;
    let h = href;
    try{ h = decodeURIComponent(href); }catch(e){}
    if(h.indexOf('罐頭音樂研究所') < 0) return;      // 只收「作品／節目頁」連結，排除站內導覽
    if(/\.(jpg|png|mp3|pdf)$/i.test(h)) return;
    if(seen.has(href + '|' + title)) return;
    seen.add(href + '|' + title);
    const sib = a.nextElementSibling;
    const label = (sib && /lbl/.test(sib.className)) ? sib.textContent.replace(/^[（(]|[）)]$/g,'').trim() : '';
    out.push({href: href, title: title, label: label});
  });
  return out;
}

$('go').addEventListener('click', search);
$('q').addEventListener('keydown', e => { if(e.key === 'Enter') search(); });

function esc(s){ return String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function search(){
  if(!whoCard()) return;
  const q = $('q').value.trim().toLowerCase().replace(/\s+/g,'');
  if(!q) return;
  $('hits').innerHTML = '<p class="muted">搜尋中…</p>';
  try{
    const lib = await loadLib();
    const hits = [];
    for(const b of lib){
      for(const a of b.albums){
        for(const t of a.t){
          const hay = (t.n + ' ' + a.n + ' ' + b.n).toLowerCase().replace(/\s+/g,'');
          if(hay.includes(q)) hits.push({rel:'罐頭音樂研究所/圖書館音樂/' + t.h + 'index.html', title:t.n, sub:b.n + ' · ' + a.n});
          if(hits.length >= 40) break;
        }
        if(hits.length >= 40) break;
      }
      if(hits.length >= 40) break;
    }
    if(!hits.length){ $('hits').innerHTML = '<p class="muted">找不到曲目，換個關鍵字或改用上面的下拉選單。</p>'; return; }
    $('hits').innerHTML = hits.map(h =>
      `<div class="hit" data-rel="${esc(h.rel)}"><div class="t">${esc(h.title)}</div><div class="m">${esc(h.sub)}</div></div>`).join('');
    [...document.querySelectorAll('.hit')].forEach(el => {
      el.addEventListener('click', () => openPage(el.dataset.rel));
    });
  }catch(e){ $('hits').innerHTML = '<p class="muted">搜尋失敗：' + esc(e.message) + '</p>'; }
}

function renderUsage(list){
  $('nuse').textContent = '（' + list.length + ' 筆）';
  $('usages').innerHTML = list.map((u,i) =>
    `<div class="usage">
      <div style="flex:1">
        <label>作品標題（連結文字）</label>
        <input type="text" data-i="${i}" data-f="title" value="${(u.title||'').replace(/"/g,'&quot;')}">
        <div style="height:6px"></div>
        <label>連結網址（單集網址，/music-library/…）</label>
        <input type="text" data-i="${i}" data-f="href" value="${(u.href||'').replace(/"/g,'&quot;')}">
        <div style="height:6px"></div>
        <label>括號標記（可留空，例：兔子公主 哥哥姐姐；CD/DVD 不寫編號）</label>
        <input type="text" data-i="${i}" data-f="label" value="${(u.label||'').replace(/"/g,'&quot;')}">
      </div>
      <button class="del" data-del="${i}">刪除</button>
    </div>`).join('');
  [...document.querySelectorAll('#usages input')].forEach(inp => {
    inp.addEventListener('input', () => {
      const i = +inp.dataset.i, f = inp.dataset.f;
      CUR.usage[i][f] = inp.value;
    });
  });
  [...document.querySelectorAll('#usages .del')].forEach(b => {
    b.addEventListener('click', () => { CUR.usage.splice(+b.dataset.del,1); renderUsage(CUR.usage); });
  });
}

$('addUsage').addEventListener('click', () => {
  if(!CUR) return;
  CUR.usage.push({href:'', title:'', label:''});
  renderUsage(CUR.usage);
});

$('saveTitle').addEventListener('click', async () => {
  if(!CUR) return;
  try{ await submit('save_title', {title:$('title').value.trim(), artist:$('artist').value.trim()}); }
  catch(e){ msg('送出失敗：' + e.message, false); }
});

$('saveUsage').addEventListener('click', async () => {
  if(!CUR) return;
  const items = CUR.usage.filter(u => u.href.trim() && u.title.trim());
  if(items.length !== CUR.usage.length && !confirm('有 ' + (CUR.usage.length-items.length) + ' 筆沒填連結或標題，會被略過。要繼續嗎？')) return;
  try{ await submit('save_usage', {items}); }
  catch(e){ msg('送出失敗：' + e.message, false); }
});

$('saveMark').addEventListener('click', async () => {
  if(!CUR) return;
  try{ await submit('save_mark', {checked:$('mark').checked}); }
  catch(e){ msg('送出失敗：' + e.message, false); }
});

whoCard();
initPickers();
initFromQuery();
</script>
</body></html>
