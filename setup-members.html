<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>開通「會員名單」｜站主設定</title>
<link rel="stylesheet" href="style.css">
<style>
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;max-width:900px}
.card h2{font-size:17px;margin:0 0 8px}
ol{font-size:14px;line-height:1.9;color:#334;padding-left:22px}
pre{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:14px;overflow:auto;font-size:12px;line-height:1.55;max-height:420px}
.btn{display:inline-block;border:1px solid #cfd8e3;background:#fff;border-radius:9px;padding:9px 14px;font:inherit;font-size:13.5px;color:#334;text-decoration:none;cursor:pointer}
.btn-main{background:#2f6feb;border-color:#2f6feb;color:#fff}
.tip{background:#f6f8fb;border:1px dashed #cfd8e3;border-radius:10px;padding:11px 13px;font-size:12.5px;color:#5c6675;line-height:1.6}
</style></head>
<body>
<header class="site-head"><div class="wrap head-row">
  <div><a class="brand" href="index.html">圖書館音樂研究所</a><div class="sub">站主設定</div></div>
  <nav class="topnav"><a class="navbtn" href="member.html">會員中心</a><a class="navbtn" href="admin.html">站主專區</a></nav>
</div></header>

<main class="wrap">
  <div class="card">
    <h2>讓「會員名單」出現在站主專區（做一次就好）</h2>
    <ol>
      <li>按下面 <b>複製 SQL</b></li>
      <li>開 <a href="https://supabase.com/dashboard/project/lgsijyfahyoceicqehwf/sql/new" target="_blank" rel="noopener">Supabase → SQL Editor</a>（會開新查詢頁）</li>
      <li>貼上 → 按右下 <b>Run</b>（應該出現 Success）</li>
      <li>回 <a href="admin.html">站主專區</a> 重新整理，就會看到名單表格</li>
    </ol>
    <p><button class="btn btn-main" id="copy">複製 SQL</button> <a class="btn" href="sql-setup-members.sql" target="_blank">看原始檔</a></p>
    <div class="tip">這段只會建立一張「會員名單」表和自動寫入規則，不會動到現有帳號資料。名單只有站主（你的 Email）讀得到，其他人讀不到。</div>
  </div>

  <div class="card">
    <h2>SQL 內容</h2>
    <pre id="sql">載入中…</pre>
  </div>
</main>

<script>
(async function(){
  try{
    const r = await fetch('sql-setup-members.sql', {cache:'no-store'});
    document.getElementById('sql').textContent = await r.text();
  }catch(e){ document.getElementById('sql').textContent = '載入失敗，請開 sql-setup-members.sql'; }
  document.getElementById('copy').addEventListener('click', async ()=>{
    const txt = document.getElementById('sql').textContent;
    try{ await navigator.clipboard.writeText(txt); }
    catch(e){
      const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
    }
    const b=document.getElementById('copy'); const old=b.textContent;
    b.textContent='已複製 ✅'; setTimeout(()=>b.textContent=old,1800);
  });
})();
</script>
</body></html>
